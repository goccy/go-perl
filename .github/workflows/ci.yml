name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify internal/perl.go / stdlib.zip attestations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify upstream-sourced files (release attestation)
        run: make verify

  # Tests run on every architecture the native XS loading supports:
  # linux/amd64, linux/arm64, and darwin/arm64. The runners ship perl,
  # make, and a C compiler, so the XS build pipeline tests run for real
  # (they self-skip only where the toolchain is missing).
  test:
    name: Go test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Race detector (core packages)
        run: go test -race . ./xs/

  # Every package must at least BUILD everywhere the library is meant to
  # embed, including platforms with no native XS loading (the xs package
  # degrades to a load-time error there) — wasip1 in particular, since
  # the interpreter core itself is pure Go.
  build-cross:
    name: Cross build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: wasip1, goarch: wasm }
          - { goos: windows, goarch: amd64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
