name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify internal/perl.go / stdlib.zip attestations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify upstream-sourced files (release attestation)
        run: make verify

  # Tests run on every architecture the native XS loading supports:
  # linux/amd64, linux/arm64, and darwin/arm64. The runners ship perl,
  # make, and a C compiler, so the XS build pipeline tests run for real
  # (they self-skip only where the toolchain is missing).
  #
  # The xs package's tests are split into shards, with and without the race
  # detector, each a job of its own: shard k of n runs every n-th test,
  # starting at the k-th. The other packages, and the core package with the
  # race detector, are one more job.
  test:
    name: Go test (${{ matrix.os }}, ${{ matrix.part.name }})
    runs-on: ${{ matrix.os }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
        part:
          - { name: packages, cache: packages }
          - { name: xs 1/2, cache: xs, shard: 0, shards: 2 }
          - { name: xs 2/2, cache: xs, shard: 1, shards: 2 }
          - { name: xs race 1/2, cache: xs-race, race: true, shard: 0, shards: 2 }
          - { name: xs race 2/2, cache: xs-race, race: true, shard: 1, shards: 2 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      # The build and module caches are saved under each commit, failed runs
      # included, and restored from the newest one. -count=1 keeps test
      # results out of them: the tests compile C sources go test does not
      # know are their inputs.
      - name: Locate the Go caches
        id: go-env
        run: |
          echo "gocache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "gomodcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        with:
          path: |
            ${{ steps.go-env.outputs.gocache }}
            ${{ steps.go-env.outputs.gomodcache }}
          key: go-test-${{ runner.os }}-${{ runner.arch }}-${{ matrix.part.cache }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-test-${{ runner.os }}-${{ runner.arch }}-${{ matrix.part.cache }}-${{ hashFiles('go.sum') }}-
            go-test-${{ runner.os }}-${{ runner.arch }}-${{ matrix.part.cache }}-
      - name: Every package but xs, and the core package with the race detector
        if: ${{ matrix.part.cache == 'packages' }}
        shell: bash
        run: |
          pkgs=$(go list ./... | grep -vxF github.com/goccy/go-perl/xs)
          go test -count=1 -timeout 10m $pkgs
          go test -race -count=1 -timeout 10m .
      - name: The shard of the xs package
        if: ${{ matrix.part.cache != 'packages' }}
        shell: bash
        env:
          RACE: ${{ matrix.part.race && '-race' || '' }}
          SHARD: ${{ matrix.part.shard }}
          SHARDS: ${{ matrix.part.shards }}
        run: |
          tests=$(go test $RACE -list '^(Test|Fuzz|Example)' ./xs/ | grep -E '^(Test|Fuzz|Example)')
          pattern=$(awk -v k="$SHARD" -v n="$SHARDS" '(NR - 1) % n == k' <<<"$tests" | paste -sd '|' -)
          go test $RACE -count=1 -timeout 10m -run "^($pattern)\$" ./xs/
      - if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ steps.go-env.outputs.gocache }}
            ${{ steps.go-env.outputs.gomodcache }}
          key: go-test-${{ runner.os }}-${{ runner.arch }}-${{ matrix.part.cache }}-${{ hashFiles('go.sum') }}-${{ github.sha }}

  # gperl build for linux/amd64 and linux/arm64 with native (XS)
  # dependencies, from each host: every binary is inspected, and the one
  # for the runner's own platform is run. The builds for each target
  # architecture are a job of their own; the dependency tests run with the
  # arm64 builds. The Go caches and the toolchain gperl installs are saved
  # and restored as the test jobs' caches are.
  test-cross:
    name: gperl cross build (${{ matrix.os }}, ${{ matrix.part.name }})
    runs-on: ${{ matrix.os }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
        part:
          - { name: amd64, run: '^TestCrossBuild$/^linux_amd64_' }
          - { name: arm64, run: '^(TestCrossBuild|TestDependenciesEndToEnd)$/^(linux_arm64_.*|link_without_cross_compiler|link|load)$' }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Locate the Go caches
        id: go-env
        run: |
          echo "gocache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "gomodcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        with:
          path: |
            ${{ steps.go-env.outputs.gocache }}
            ${{ steps.go-env.outputs.gomodcache }}
            ~/gperl/toolchain
          key: gperl-cross-${{ runner.os }}-${{ runner.arch }}-${{ matrix.part.name }}-${{ hashFiles('go.sum', 'internal/gperl/install.go') }}-${{ github.sha }}
          restore-keys: |
            gperl-cross-${{ runner.os }}-${{ runner.arch }}-${{ matrix.part.name }}-${{ hashFiles('go.sum', 'internal/gperl/install.go') }}-
            gperl-cross-${{ runner.os }}-${{ runner.arch }}-${{ matrix.part.name }}-
      - run: go run ./cmd/gperl install toolchain
      - env:
          GPERL_TEST_CROSS: "1"
          RUN: ${{ matrix.part.run }}
        run: go test -count=1 -timeout 10m -run "$RUN" ./internal/gperl
      - if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ steps.go-env.outputs.gocache }}
            ${{ steps.go-env.outputs.gomodcache }}
            ~/gperl/toolchain
          key: gperl-cross-${{ runner.os }}-${{ runner.arch }}-${{ matrix.part.name }}-${{ hashFiles('go.sum', 'internal/gperl/install.go') }}-${{ github.sha }}

  # The Plack example on real CPAN distributions (Plack, Mojolicious, and
  # the XS distributions Cpanel::JSON::XS and Clone): gperl fetches and
  # builds them, and the Go application links them in.
  example-plack:
    name: Plack example (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - working-directory: examples/plack
        run: make setup test

  # Every package must at least BUILD everywhere the library is meant to
  # embed, including platforms with no native XS loading (the xs package
  # degrades to a load-time error there) — wasip1 in particular, since
  # the interpreter core itself is pure Go.
  build-cross:
    name: Cross build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: wasip1, goarch: wasm }
          - { goos: windows, goarch: amd64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
